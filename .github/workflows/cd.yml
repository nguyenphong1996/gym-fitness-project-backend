name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [main, dev, ci/cd]
  # Tạm thời thêm manual trigger để test
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "🚀 Starting deployment..."
          echo "📌 Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "📂 Navigating to ~/gymxfit"
          cd ~/gymxfit
          
          echo "🛑 Stopping running containers..."
          docker compose down
          
          echo "📥 Pulling latest Docker images..."
          docker compose pull
          
          echo "▶️  Starting containers with new images..."
          docker compose up -d
          
          echo "✅ Deployment completed successfully!"
          echo "📊 Running containers:"
          docker compose ps
          
          echo "🔍 Checking container health..."
          sleep 5
          docker compose ps | grep "Up" && echo "✅ All containers are running!" || echo "⚠️ Some containers may have issues"
